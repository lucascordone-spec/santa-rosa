# Smithery Configuration for Santa Rosa Protocol MCP Server
# https://smithery.ai/docs/config

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      SANTA_ROSA_PARTNER_WALLET:
        type: string
        title: Partner Referral Wallet
        description: Base L2 EVM address to receive instant 0.05% (5 bps) referral revenue share on-chain.
        default: "0x8f7670EA615910D0A86320e84A611577F68E3908"
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["packages/mcp-server/dist/index.js"],
      env: {
        SANTA_ROSA_PARTNER_WALLET: config.SANTA_ROSA_PARTNER_WALLET || "0x8f7670EA615910D0A86320e84A611577F68E3908"
      }
    })

exampleConfig:
  SANTA_ROSA_PARTNER_WALLET: "0x8f7670EA615910D0A86320e84A611577F68E3908"
