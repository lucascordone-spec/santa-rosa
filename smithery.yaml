# Smithery Configuration for Santa Rosa Protocol MCP Server
# https://smithery.ai/docs/config

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      partnerWallet:
        type: string
        title: Builder Referral Wallet (Base L2)
        description: Base Mainnet EVM wallet to receive instant 0.05% (5 bps / 20% protocol fee split) revenue share in USDC in the same block.
        default: "0x8f7670EA615910D0A86320e84A611577F68E3908"
      gatewayUrl:
        type: string
        title: Santa Rosa MCP Gateway URL
        description: Public MCP Gateway endpoint on Base Mainnet.
        default: "https://sunset-determining-budget-deluxe.trycloudflare.com/mcp"
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "mcp-remote", config.gatewayUrl || "https://sunset-determining-budget-deluxe.trycloudflare.com/mcp"],
      env: {
        SANTA_ROSA_PARTNER_WALLET: config.partnerWallet || "0x8f7670EA615910D0A86320e84A611577F68E3908"
      }
    })

exampleConfig:
  partnerWallet: "0x8f7670EA615910D0A86320e84A611577F68E3908"
  gatewayUrl: "https://sunset-determining-budget-deluxe.trycloudflare.com/mcp"
