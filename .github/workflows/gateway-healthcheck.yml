name: MCP Gateway Healthcheck

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    name: Audit Remote MCP Gateway & REST Endpoints
    runs-on: ubuntu-latest
    env:
      GATEWAY_URL: "https://sunset-determining-budget-deluxe.trycloudflare.com"

    steps:
      - name: Ping REST Health API (/health)
        run: |
          echo "🔍 Auditing REST Health endpoint at $GATEWAY_URL/health..."
          START_TIME=$(date +%s%N)
          HTTP_STATUS=$(curl -s -o health_response.json -w "%{http_code}" "$GATEWAY_URL/health")
          END_TIME=$(date +%s%N)
          LATENCY=$(( (END_TIME - START_TIME) / 1000000 ))

          echo "HTTP Status Code: $HTTP_STATUS (Latency: ${LATENCY}ms)"
          cat health_response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ ERROR: Health endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "✅ REST Health endpoint is ONLINE and healthy."

      - name: Audit Remote MCP Server (/mcp) — tools/list
        run: |
          echo "🤖 Auditing Remote MCP Gateway (tools/list)..."
          START_TIME=$(date +%s%N)
          HTTP_STATUS=$(curl -s -X POST "$GATEWAY_URL/mcp" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {}}' \
            -o mcp_response.json \
            -w "%{http_code}")
          END_TIME=$(date +%s%N)
          LATENCY=$(( (END_TIME - START_TIME) / 1000000 ))

          echo "HTTP Status Code: $HTTP_STATUS (Latency: ${LATENCY}ms)"
          cat mcp_response.json | jq . || cat mcp_response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ ERROR: MCP endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi

          # Verify that tools array exists and contains expected tools
          TOOL_COUNT=$(jq '.result.tools | length' mcp_response.json 2>/dev/null || echo "0")
          echo "Discovered Tools Count: $TOOL_COUNT"

          if [ "$TOOL_COUNT" -lt 5 ]; then
            echo "❌ ERROR: Expected at least 5 MCP tools, found $TOOL_COUNT"
            exit 1
          fi

          echo "✅ MCP Gateway tools/list returned $TOOL_COUNT operational tools."

      - name: Audit Remote MCP Server (/mcp) — ping
        run: |
          echo "📡 Auditing MCP Ping method..."
          HTTP_STATUS=$(curl -s -X POST "$GATEWAY_URL/mcp" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc": "2.0", "id": 2, "method": "ping"}' \
            -o ping_response.json \
            -w "%{http_code}")

          echo "Ping HTTP Status Code: $HTTP_STATUS"
          cat ping_response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ ERROR: MCP ping returned HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "✅ MCP Gateway JSON-RPC 2.0 Ping verified."
